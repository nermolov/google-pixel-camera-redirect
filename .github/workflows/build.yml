name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: v
        if: github.ref_type == 'tag'
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          printf %s "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble
        working-directory: app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          args=()
          if [[ -n "$VERSION_NAME" ]]; then
            args+=(-PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE")
          fi
          ./gradlew assembleRelease "${args[@]}"

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: app/app/build/outputs/apk/release/*.apk
